<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주어 찾기 퀴즈</title>
<style>
  :root { --navy:#0B3D91; --blue:#0070C0; --title:#4F86E8; --green:#2E9E5B; --gray:#BFBFBF; --red:#D94F4F; --btn-gray:#9E9E9E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9eef5; color: var(--navy);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  #stage { position: relative; margin: 0 auto; background: #fff; overflow: hidden; }
  .screen { display: none; }
  .screen.on { display: block; }
  .bg { display: block; width: 100%; height: auto; }
  .chip { border-radius: 14px; font-weight: 800; background: #fff; color: var(--navy); border: 3px solid var(--blue); }
  .chip.ok { background: var(--green); color: #fff; border-color: var(--green); }
  .chip.dim { color: var(--gray); border-color: var(--gray); }
  .big { background: var(--blue); color: #fff; border: 0; border-radius: 12px; font-weight: 800; }
  .small { background: var(--btn-gray); color: #fff; border: 0; border-radius: 5px; font-weight: 800; white-space: nowrap; padding: 0; }
  .words { display: flex; justify-content: center; flex-wrap: wrap; }
  .head { font-weight: 800; }
  .head.bad { color: var(--red); }
  .expl { font-weight: 700; }
  .sum { list-style: none; margin: 0; padding: 0; font-weight: 700; }
  .sum b { color: var(--green); }
  .qrbox { text-align: center; color: var(--navy); font-weight: 700; }
  .qrsvg { display: block; width: 100%; height: auto; background: #fff; }
  .nav { display: flex; align-items: center; justify-content: space-between; }

  /* ---------- 넓은 화면: 슬라이드 모양 (16:9) ---------- */
  body.land { display: flex; align-items: center; justify-content: center; }
  body.land #stage { width: var(--w); height: calc(var(--w) * 9 / 16); box-shadow: 0 4px 24px rgba(0,0,0,.15); }
  body.land .screen { position: absolute; inset: 0; }
  body.land .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.land .title { position: absolute; left: 10%; right: 10%; top: 4.5%; text-align: center; font-weight: 800; color: var(--title); font-size: calc(var(--u) * 4.2); }
  body.land .inst { position: absolute; left: 5%; right: 5%; top: 23%; text-align: center; font-weight: 800; font-size: calc(var(--u) * 2.7); }
  body.land .words { position: absolute; left: 3%; right: 3%; top: 38.6%; gap: calc(var(--u) * 2.1); }
  body.land .chip { height: calc(var(--u) * 8.2); padding: 0 calc(var(--u) * 2.3); font-size: calc(var(--u) * 3.33); border-width: calc(var(--u) * .26); border-radius: calc(var(--u) * 1.3); }
  body.land .fb { position: absolute; left: 9%; right: 9%; top: 58%; text-align: center; font-size: calc(var(--u) * 2.3); line-height: 1.4; }
  body.land .nav { position: absolute; left: 13.5%; width: 72.9%; top: 78%; height: 11.7%; }
  body.land .big { width: calc(var(--u) * 20.8); height: calc(var(--u) * 6.56); font-size: calc(var(--u) * 2.3); border-radius: calc(var(--u) * 1.1); margin-left: auto; }
  body.land .small { width: calc(var(--u) * 6.94); height: calc(var(--u) * 2.19); font-size: max(10px, calc(var(--u) * .94)); }
  body.land .count { position: absolute; right: 21%; top: 89.5%; color: var(--gray); font-size: calc(var(--u) * 1.5); }
  body.land .sum { position: absolute; left: 6.3%; right: 6.3%; top: 21%; font-size: calc(var(--u) * var(--sumsize, 2.0)); line-height: 1.55; }
  body.land #cover .qrbox { position: absolute; left: 79%; top: 35%; width: 16%; font-size: calc(var(--u) * 1.3); }
  body.land #cover .start { position: absolute; left: 39.6%; top: 86%; width: 20.8%; height: 9%; font-size: calc(var(--u) * 2.3); }
  body.land #end .score { position: absolute; left: 10%; right: 10%; top: 26%; text-align: center; font-weight: 800; color: var(--blue); font-size: calc(var(--u) * 2.9); }

  /* ---------- 휴대폰 세로 화면: 위에서 아래로 ---------- */
  body.port #stage { width: 100%; min-height: 100%; }
  body.port .screen { padding-bottom: 24px; }
  body.port #q .bg, body.port #fb .bg, body.port #sum .bg { display: none; }
  body.port .title { margin: 22px 16px 6px; padding-bottom: 10px; border-bottom: 2px solid var(--blue); text-align: center; font-weight: 800; color: var(--title); font-size: 26px; }
  body.port .inst { margin: 14px 16px; text-align: center; font-weight: 800; font-size: 17px; }
  body.port .words { gap: 10px; margin: 18px 12px; }
  body.port .chip { min-height: 56px; padding: 8px 18px; font-size: 24px; }
  body.port .fb { margin: 16px 18px; text-align: center; font-size: 16px; line-height: 1.5; }
  body.port .nav { margin: 22px 16px 0; }
  body.port .big { width: 60%; height: 54px; font-size: 18px; margin-left: auto; }
  body.port .small { width: 20%; height: 18px; font-size: 10px; }
  body.port .count { text-align: center; color: var(--gray); font-size: 13px; margin-top: 12px; }
  body.port .sum { margin: 10px 18px; font-size: 15px; line-height: 1.7; }
  body.port #cover .qrbox { width: 46%; margin: 18px auto 0; font-size: 13px; }
  body.port #cover .start { display: block; width: 70%; height: 56px; margin: 18px auto 0; font-size: 20px; }
  body.port #end .score { margin: 20px 16px; text-align: center; font-weight: 800; color: var(--blue); font-size: 24px; }
</style>
</head>

<script>
const QUIZ = {"prefix": "주어 찾기", "instruction": "다음 문장에서 주어를 찾아 클릭하세요.", "questions": [{"words": ["꽃이", "예쁘다."], "answers": [0], "explain": "'무엇이 예쁜가?' → 꽃이. 형용사 문장에도 주어가 있어요."}, {"words": ["철수가", "학교에", "간다."], "answers": [0], "explain": "'누가 가는가?'에 답하는 말이 주어예요. '학교에'는 부사어예요."}, {"words": ["영희가", "책을", "읽는다."], "answers": [0], "explain": "'누가 읽는가?' → 영희가. '책을'은 목적어예요."}, {"words": ["순이가", "민수에게", "책을", "주었다."], "answers": [0], "explain": "'누가 주었는가?' → 순이가. '민수에게'는 부사어, '책을'은 목적어예요."}, {"words": ["경호는", "학생이", "아니다."], "answers": [0], "explain": "'는'은 보조사지만 '경호는'이 주어예요. '학생이'는 '아니다' 앞에 오는 보어예요."}, {"words": ["영희가", "어른이", "되었다."], "answers": [0], "explain": "'누가 되었는가?' → 영희가. '어른이'는 '되다' 앞에 오는 보어예요."}, {"words": ["철수가", "기분이", "나쁘다."], "answers": [0], "explain": "'철수가'가 주어예요. '기분이 나쁘다'는 철수가 어떤지 설명하는 부분이에요."}, {"words": ["철수는", "책이", "없다."], "answers": [0], "explain": "'철수는'이 주어예요. '책이 없다'는 철수가 어떤지 설명하는 부분이에요."}, {"words": ["철수한테", "돈이", "많다."], "answers": [0], "explain": "돈이 많은 사람은 철수예요. '한테'가 붙어도 '철수한테'를 주어로 봐요."}, {"words": ["교실에", "책상이", "있다."], "answers": [0], "explain": "책상이 있는 곳은 교실이에요. '에'가 붙어도 '교실에'를 주어로 봐요."}]};
const N = QUIZ.questions.length;
let k = 0, score = 0, results = [];   // results[i] = true/false (맞힘 여부)
const $ = id => document.getElementById(id);

function layout() {
  const port = window.innerWidth < window.innerHeight * 1.1 && window.innerWidth < 900;
  document.body.className = port ? 'port' : 'land';
  const w = Math.min(window.innerWidth, window.innerHeight * 16 / 9);
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--u', (w / 100) + 'px');
}
window.addEventListener('resize', layout); layout();

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}
function chip(text, cls) { const b = document.createElement('button'); b.className = 'chip ' + (cls || ''); b.textContent = text; return b; }

function ask() {
  const q = QUIZ.questions[k];
  $('qTitle').textContent = QUIZ.prefix + ' ' + (k + 1);
  $('qInst').textContent = QUIZ.instruction;
  $('qCount').textContent = (k + 1) + ' / ' + N;
  const box = $('qWords'); box.innerHTML = '';
  q.words.forEach((w, i) => { const b = chip(w); b.onclick = () => answer(i); box.appendChild(b); });
  show('q');
}
function answer(i) {               // 한 번만: 누르는 순간 결과가 정해지고 문제 화면으로 돌아갈 길이 없다
  const q = QUIZ.questions[k];
  const ok = q.answers.includes(i);
  results[k] = ok; if (ok) score++;
  feedback();
}
function feedback() {
  const q = QUIZ.questions[k], ok = results[k];
  $('fTitle').textContent = QUIZ.prefix + ' ' + (k + 1) + '  ·  ' + (ok ? '정답' : '정답 확인');
  const box = $('fWords'); box.innerHTML = '';
  q.words.forEach((w, i) => { const b = chip(w, q.answers.includes(i) ? 'ok' : 'dim'); b.disabled = true; box.appendChild(b); });
  $('fHead').textContent = ok ? '정답이에요! 🎉' : '아쉬워요! 정답은 초록색 어절이에요.';
  $('fHead').className = 'head' + (ok ? '' : ' bad');
  $('fExpl').textContent = q.explain;
  $('prevBtn').style.visibility = k > 0 ? 'visible' : 'hidden';   // 푼 뒤에만, 2번 문제부터
  $('nextBtn').textContent = k < N - 1 ? '다음 문제 ▶' : '끝내기 ▶';
  show('fb');
}
$('nextBtn').onclick = () => { k++; if (k < N) ask(); else finish(); };
$('prevBtn').onclick = () => {
  const ul = $('sumList'); ul.innerHTML = '';
  for (let j = 0; j <= k; j++) {
    const q = QUIZ.questions[j], li = document.createElement('li');
    li.append((j + 1) + ')  ' + q.words.join(' ') + '   →   ');
    const b = document.createElement('b'); b.textContent = '정답: ' + q.answers.map(i => q.words[i]).join(', ');
    li.appendChild(b); ul.appendChild(li);
  }
  document.documentElement.style.setProperty('--sumsize', k < 6 ? 2.0 : 1.6);
  show('sum');
};
$('backBtn').onclick = () => show('fb');
function finish() { $('score').textContent = N + '문제 중 ' + score + '문제를 맞혔어요!'; show('end'); }
$('startBtn').onclick = () => { k = 0; score = 0; results = []; ask(); };
show('cover');
</script>
</body>
</html>
